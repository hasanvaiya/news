<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Bulletin - Premium Dark News</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dark-theme">
    <!-- Ambient Glowing Backgrounds -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Splash Screen -->
    <div id="splash" class="splash">
        <div class="splash-inner">
            <div class="splash-logo">The<span>Bulletin</span></div>
            <div class="splash-loader"><div class="splash-bar"></div></div>
        </div>
    </div>

    <!-- App Header & Category Chips -->
    <header class="app-header glass-panel">
        <div class="header-top">
            <h1 class="logo">The<span>Bulletin</span></h1>
            <div class="header-actions">
                <button id="refresh-btn-main" class="icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin-icon"><path d="M21 2v6h-6M3 12a9 9 0 1 0 2.6-6.4L2 9"/></svg>
                </button>
                <button id="nav-bookmark" class="icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
                    <span id="bookmark-badge" class="badge hidden">0</span>
                </button>
            </div>
        </div>
        
        <!-- Premium Animated Category Selector -->
        <div class="category-slider">
            <button class="cat-chip active" onclick="scrollToSection('top-stories')">⚡ Top Stories</button>
            <button class="cat-chip" onclick="scrollToSection('politics-news')">🏛️ Politics</button>
            <button class="cat-chip" onclick="scrollToSection('bd-news')">🇧🇩 Bangladesh</button>
            <button class="cat-chip" onclick="scrollToSection('international-news')">🌍 World</button>
            <button class="cat-chip" onclick="scrollToSection('sports-news')">⚽ Sports</button>
        </div>
    </header>

    <!-- Main Feed -->
    <main class="app-main" id="home-view">
        <div class="feed-container">
            
            <!-- Top Stories -->
            <section id="top-stories" class="feed-section">
                <div class="section-title">
                    <div class="title-indicator"></div>
                    <h2>Top Stories</h2>
                </div>
                <div id="top-loader" class="skeleton-loader">
                    <div class="sk-hero"></div><div class="sk-row"><div class="sk-box"></div><div class="sk-box"></div></div>
                </div>
                <div id="top-grid" class="magazine-grid"></div>
            </section>

            <!-- Politics -->
            <section id="politics-news" class="feed-section">
                <div class="section-title">
                    <div class="title-indicator"></div>
                    <h2>Politics</h2>
                </div>
                <div id="politics-loader" class="skeleton-loader">
                    <div class="sk-hero"></div><div class="sk-row"><div class="sk-box"></div><div class="sk-box"></div></div>
                </div>
                <div id="politics-grid" class="magazine-grid"></div>
            </section>

            <!-- Bangladesh -->
            <section id="bd-news" class="feed-section">
                <div class="section-title">
                    <div class="title-indicator"></div>
                    <h2>Bangladesh</h2>
                </div>
                <div id="bd-loader" class="skeleton-loader">
                    <div class="sk-hero"></div><div class="sk-row"><div class="sk-box"></div><div class="sk-box"></div></div>
                </div>
                <div id="bd-grid" class="magazine-grid"></div>
            </section>

            <!-- International -->
            <section id="international-news" class="feed-section">
                <div class="section-title">
                    <div class="title-indicator"></div>
                    <h2>International</h2>
                </div>
                <div id="international-loader" class="skeleton-loader">
                    <div class="sk-hero"></div><div class="sk-row"><div class="sk-box"></div><div class="sk-box"></div></div>
                </div>
                <div id="international-grid" class="magazine-grid"></div>
            </section>

            <!-- Sports -->
            <section id="sports-news" class="feed-section">
                <div class="section-title">
                    <div class="title-indicator"></div>
                    <h2>Sports</h2>
                </div>
                <div id="sports-loader" class="skeleton-loader">
                    <div class="sk-hero"></div><div class="sk-row"><div class="sk-box"></div><div class="sk-box"></div></div>
                </div>
                <div id="sports-grid" class="magazine-grid"></div>
            </section>

        </div>
    </main>

    <!-- Bookmarks View -->
    <main class="app-main hidden" id="bookmarks-view">
        <header class="bookmarks-header glass-panel">
            <button id="back-to-home" class="icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="logo" style="font-size:1.5rem">Saved<span>News</span></h1>
            <div style="width:36px"></div> <!-- Spacer for flex balance -->
        </header>
        <div id="bookmarks-list" class="bookmarks-feed" style="margin-top: 20px;">
            <!-- Saved items -->
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
